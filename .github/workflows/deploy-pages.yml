name: Build and Deploy Photographer Static Site

on:
  workflow_dispatch:
    inputs:
      cms_sha:
        description: 'CMS commit SHA to deploy'
        required: false
  repository_dispatch:
    types: [photographer-publish]
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: photographer-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CMS_API_URL: https://cms.sitestudio.lt
  BASE_PATH: /photographer-site

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages_artifact: ${{ steps.upload_artifact.outputs.artifact_name }}
    steps:
      - name: Checkout photographer-site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Fetch published content from CMS
        id: fetch_content
        run: |
          set -euo pipefail
          echo "Attempting to fetch published content from CMS..."
          # Try to fetch from CMS, fall back to existing HTML if CMS unavailable
          RESPONSE=$(curl -sf -H "Accept: application/json" \
            "${CMS_API_URL}/public/photographer/content" 2>/dev/null) || RESPONSE=""
          
          if [ -n "$RESPONSE" ] && echo "$RESPONSE" | jq -e '.pages' > /dev/null 2>&1; then
            echo "$RESPONSE" > cms-content.json
            echo "Content fetched from CMS successfully"
          else
            echo "CMS unavailable, using fallback content"
            echo '{"pages":[],"services":[],"projects":[],"faqs":[],"settings":null}' > cms-content.json
          fi

      - name: Build static site
        run: node scripts/build-static.js

      - name: Validate metadata
        run: node scripts/validate-metadata.js

      - name: Upload Pages artifact
        id: upload_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

  notify_cms:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Notify CMS of successful deployment
        run: |
          curl -X POST "${CMS_API_URL}/api/deployments/photographer-site/complete" \
            -H "Content-Type: application/json" \
            -d '{"sha": "${{ github.sha }}", "status": "success", "url": "https://setoviktor1-beep.github.io/photographer-site/"}' || true